
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A VERDADE — SAMUCA × VOID</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050509;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#stage{height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse,#1b121a,#050509 72%)}
canvas{width:min(100vw,1100px);height:auto;max-height:100vh;border:1px solid #45303b;box-shadow:0 0 55px #000;background:#0b0a10}
.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,3,8,.88);padding:18px}
.panel{width:min(520px,94vw);padding:32px 26px;text-align:center;background:linear-gradient(145deg,#1b141d,#08080d);border:1px solid #70404d;box-shadow:0 0 45px #000,0 0 30px #65172a33}
h1{font-size:clamp(40px,8vw,76px);letter-spacing:8px;margin:0;text-shadow:0 0 20px #c21f40}
.sub{font-size:11px;letter-spacing:4px;color:#a99aa4;margin:12px 0 26px}
button{width:100%;padding:13px;margin:7px 0;color:#f4edf0;background:#171117;border:1px solid #70404d;letter-spacing:2px;font-size:15px;cursor:pointer}
button:hover{background:#35131e;border-color:#f05b70}
#hint{font-size:12px;color:#aaa;line-height:1.7;margin-top:16px}
#topmsg{position:fixed;top:16px;left:0;right:0;text-align:center;pointer-events:none;color:#eee;letter-spacing:2px;font-size:13px;text-shadow:0 2px 6px #000}
.hidden{display:none!important}
.credits h2{letter-spacing:5px;font-size:42px;margin:8px}
.red{color:#e0445b;text-shadow:0 0 16px #b21b34}
@media(max-width:600px){.panel{padding:24px 18px}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="960" height="540" aria-label="Jogo A Verdade"></canvas></div>
<div id="topmsg"></div>

<section class="screen" id="menu">
<div class="panel">
<h1>A VERDADE</h1>
<div class="sub">UM MISTÉRIO COMEÇA</div>
<button id="play">JOGAR</button>
<button id="options">OPÇÕES</button>
<button id="quit">SAIR</button>
<div id="hint">SAMUCA × VOID APRESENTAM<br>Uma aventura ainda não terminou...</div>
</div>
</section>

<section class="screen hidden" id="pause">
<div class="panel">
<h1 style="font-size:42px">PAUSADO</h1>
<button id="resume">CONTINUAR</button>
<button id="restart">RECOMEÇAR FASE</button>
<button id="back">MENU PRINCIPAL</button>
</div>
</section>

<section class="screen hidden" id="credits">
<div class="panel credits">
<div class="sub">UM JOGO CRIADO POR</div>
<h2>SAMUCA</h2>
<div class="sub">+</div>
<h2 class="red">VOID</h2>
<div class="sub" style="margin-top:24px">FIM... OU SERÁ QUE NÃO?</div>
<button id="again">VOLTAR AO INÍCIO</button>
</div>
</section>

<script>
const canvas=document.querySelector('#game'),c=canvas.getContext('2d'),$=id=>document.getElementById(id);
let state='menu',keys={},camera=0,frame=0,fragments=0,checkpoint=100;
const worldW=2380,portalX=2180;
let player;

const platforms=[
{x:0,y:478,w:570,h:62},
{x:650,y:478,w:400,h:62},
{x:1120,y:478,w:410,h:62},
{x:1600,y:478,w:780,h:62},
{x:330,y:390,w:145,h:18},
{x:760,y:385,w:145,h:18},
{x:1230,y:365,w:150,h:18},
{x:1740,y:390,w:145,h:18},
{x:1950,y:335,w:130,h:18}
];

const spikes=[
{x:500,y:454,w:70,h:24},
{x:990,y:454,w:65,h:24},
{x:1450,y:454,w:80,h:24},
{x:1870,y:454,w:70,h:24}
];

const shards=[
{x:395,y:350,taken:false},
{x:825,y:345,taken:false},
{x:1300,y:325,taken:false},
{x:1805,y:350,taken:false}
];

let enemy={x:1180,y:442,w:28,h:36,min:1160,max:1430,dir:1,alive:true};

function reset(){
player={x:90,y:410,w:26,h:62,vx:0,vy:0,onGround:false,face:1,alive:true};
camera=0;frame=0;fragments=0;checkpoint=100;
shards.forEach(s=>s.taken=false);
enemy={x:1180,y:442,w:28,h:36,min:1160,max:1430,dir:1,alive:true};
}

function show(id){
['menu','pause','credits'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
}

function start(){
reset();
state='play';
show('none');
$('topmsg').textContent='ENCONTRE OS FRAGMENTOS. ALCANCE O PORTAL.';
}

$('play').onclick=start;
$('resume').onclick=()=>{state='play';show('none')};
$('restart').onclick=()=>{reset();state='play';show('none')};
$('back').onclick=()=>{state='menu';show('menu');$('topmsg').textContent=''};
$('again').onclick=()=>{state='menu';show('menu');$('topmsg').textContent=''};

$('options').onclick=()=>{
$('hint').innerHTML='CONTROLES: A/D ou ←/→ ANDAR · ESPAÇO PULAR<br>ESC PAUSAR · MÚSICA DESATIVADA<br>OBJETIVO: ENCONTRE OS FRAGMENTOS E O PORTAL.'
};

$('quit').onclick=()=>{
$('hint').textContent='Para sair, feche esta aba. Até a próxima.'
};

window.addEventListener('keydown',e=>{
let k=e.key.toLowerCase();
keys[k]=true;
if(k===' '||k.startsWith('arrow'))e.preventDefault();
if(k==='escape'){
if(state==='play'){state='pause';show('pause')}
else if(state==='pause'){state='play';show('none')}
}
});

window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function box(x,y,w,h,color){
c.fillStyle=color;
c.fillRect(x,y,w,h);
}

function playerDraw(){
c.save();
c.translate(player.x+13,player.y+5);
c.strokeStyle='#eee9ed';
c.lineWidth=5;
c.lineCap='round';
c.shadowColor='#e9dce5';
c.shadowBlur=8;
c.beginPath();
c.arc(0,8,8,0,Math.PI*2);
c.stroke();
c.beginPath();
c.moveTo(0,17);
c.lineTo(0,40);
c.moveTo(0,24);
c.lineTo(-11,32);
c.moveTo(0,24);
c.lineTo(11,32);
c.moveTo(0,40);
c.lineTo(-9,55);
c.moveTo(0,40);
c.lineTo(9,55);
c.stroke();
c.restore();
}

function respawn(){
player.x=checkpoint;
player.y=400;
player.vx=player.vy=0;
$('topmsg').textContent='VOCÊ CAIU. CONTINUE...';
}

function update(){
if(state!=='play')return;
frame++;

let L=keys.a||keys.arrowleft;
let R=keys.d||keys.arrowright;

player.vx=L?-4.2:R?4.2:0;
if(L)player.face=-1;
if(R)player.face=1;

if((keys[' ']||keys.w||keys.arrowup)&&player.onGround){
player.vy=-12.5;
player.onGround=false;
}

player.vy=Math.min(player.vy+.58,14);
player.x=Math.max(0,Math.min(worldW-player.w,player.x+player.vx));

let oldY=player.y;
player.y+=player.vy;
player.onGround=false;

for(const p of platforms){
if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){
player.y=p.y-player.h;
player.vy=0;
player.onGround=true;
}
}

for(const s of spikes){
if(player.x+player.w>s.x&&player.x<s.x+s.w&&player.y+player.h>s.y+5)respawn();
}

if(enemy.alive){
enemy.x+=enemy.dir*1.25;
if(enemy.x<enemy.min||enemy.x>enemy.max)enemy.dir*=-1;

if(player.x+player.w>enemy.x&&player.x<enemy.x+enemy.w&&player.y+player.h>enemy.y&&player.y<enemy.y+enemy.h){
if(player.vy>1&&player.y+player.h-enemy.y<18){
enemy.alive=false;
player.vy=-8;
$('topmsg').textContent='INIMIGO DERROTADO!';
}else respawn();
}
}

for(const s of shards){
if(!s.taken&&Math.abs((player.x+13)-s.x)<25&&Math.abs((player.y+25)-s.y)<35){
s.taken=true;
fragments++;
$('topmsg').textContent='FRAGMENTO ENCONTRADO: '+fragments+'/4';
}
}

if(player.x>checkpoint+430&&checkpoint<700)checkpoint=650;
if(player.y>620)respawn();

if(player.x>portalX){
state='credits';
show('credits');
$('topmsg').textContent='';
}

camera=Math.max(0,Math.min(player.x-300,worldW-960));
}

function draw(){
let g=c.createLinearGradient(0,0,0,540);
g.addColorStop(0,'#19121d');
g.addColorStop(1,'#07080d');
c.fillStyle=g;
c.fillRect(0,0,960,540);

for(let i=0;i<45;i++){
let x=((i*137-camera*.13)%1000+1000)%1000;
let y=(i*71)%330;
c.fillStyle='rgba(211,165,190,.22)';
c.fillRect(x,y,2,2);
}

c.save();
c.translate(-camera,0);

for(let i=0;i<13;i++){
let x=i*210+80;
box(x,300-(i%3)*35,55,178,'#100f17');
box(x+9,315-(i%3)*35,5,90,'#29202d');
}

for(const p of platforms){
box(p.x,p.y,p.w,p.h,'#28242e');
box(p.x,p.y,p.w,4,'#765461');
}

for(const s of spikes){
c.fillStyle='#b42c46';
c.beginPath();
for(let i=0;i<5;i++){
let x=s.x+i*s.w/4;
c.lineTo(x,s.y+(i%2?24:0));
}
c.lineTo(s.x+s.w,s.y+s.h);
c.lineTo(s.x,s.y+s.h);
c.fill();
}

for(const s of shards){
if(!s.taken){
c.save();
c.translate(s.x,s.y+Math.sin(frame/15)*4);
c.rotate(Math.PI/4);
c.shadowColor='#e44b6a';
c.shadowBlur=18;
box(-7,-7,14,14,'#ed7890');
c.restore();
}
}

if(enemy.alive){
c.shadowColor='#d32e4d';
c.shadowBlur=15;
box(enemy.x,enemy.y,enemy.w,enemy.h,'#541a2b');
box(enemy.x+5,enemy.y+8,5,4,'#ff7185');
box(enemy.x+18,enemy.y+8,5,4,'#ff7185');
c.shadowBlur=0;
}

c.shadowColor='#e52b50';
c.shadowBlur=30;
c.strokeStyle='#e24b68';
c.lineWidth=7;
c.beginPath();
c.ellipse(portalX+28,410,28,68,0,0,Math.PI*2);
c.stroke();
c.shadowBlur=0;
c.fillStyle='rgba(175,20,50,.2)';
c.beginPath();
c.ellipse(portalX+28,410,22,60,0,0,Math.PI*2);
c.fill();

playerDraw();
c.restore();

c.fillStyle='#eee';
c.font='bold 14px Arial';
c.fillText('MUNDO 01 / O CAMINHO',24,28);
c.font='12px Arial';
c.fillStyle='#aaa';
c.fillText('FRAGMENTOS '+fragments+'/4',24,49);
box(24,60,190,3,'#39313b');
box(24,60,Math.min(190,player.x/portalX*190),3,'#d13c59');
c.fillStyle='#aaa';
c.fillText('A/D ou ←/→ mover · ESPAÇO pular · ESC pausar',24,520);
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
